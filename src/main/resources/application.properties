# =========================================
# SPRING APPLICATION
# =========================================
spring.application.name=fenlab-docker

# =========================================
# POSTGRESQL
# =========================================
spring.datasource.url=jdbc:postgresql://postgres.railway.internal:5432/railway
spring.datasource.username=postgres
spring.datasource.password=YiDGnbppRJFgzTVqdEqPPbVqMgqLlEQG
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# =========================================
# FILE UPLOAD
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# =========================================
# REDIS
# =========================================
spring.data.redis.url=${REDIS_URL}

# =========================================
# MINIO
# =========================================
minio.url=http://exciting-light.railway.internal:9000
minio.public-url=https://exciting-light-production.up.railway.app
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.buckets.videos=fenlab-videos
minio.buckets.images=fenlab-images
minio.buckets.pdfs=fenlab-pdfs
minio.buckets.profiles=fenlab-profiles

# =========================================
# JWT
# =========================================
jwt.secret=fenlab-super-secret-key-for-hs512-algorithm-this-must-be-at-least-64-characters-long-1234567890
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# =========================================
# SERVER
# =========================================
server.port=8080
server.address=0.0.0.0
server.compression.enabled=true

# =========================================
# FLYWAY
# =========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =========================================
# CORS
# =========================================
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# =========================================
# ACTUATOR
# =========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always